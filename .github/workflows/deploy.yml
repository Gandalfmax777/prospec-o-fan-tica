name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push image
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.img.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: img
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Duas tags, e não só `latest`, porque a poda depende disso.
          #
          # Com `latest` sozinha, cada push tira a tag da imagem anterior e a
          # deixa órfã — o passo "apagar versões sem tag" então varreria TODO o
          # histórico e sobraria exatamente uma imagem, sem rollback nenhum.
          # A tag de sha mantém as anteriores referenciáveis, e aí o segundo
          # passo poda por contagem, como deveria.
          tags: |
            ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_BETTER_AUTH_URL=${{ secrets.VITE_BETTER_AUTH_URL }}

  deploy:
    name: Trigger Coolify deploy
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Call Coolify webhook
        env:
          URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          TOKEN: ${{ secrets.COOLIFY_API_KEY }}
        run: |
          curl -fsSL --retry 3 --retry-delay 5 -X GET "$URL" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/json"

  # Poda o registry.
  #
  # O GHCR não tem política de retenção nativa para pacote container: sem isto,
  # cada push na main deixa mais uma versão para sempre.
  #
  # São dois passos porque `min-versions-to-keep` conta versões por IDADE, sem
  # olhar tag. Uma órfã recém-criada é recente e sobreviveria a um passo único —
  # que é justamente o lixo que motivou o job.
  limpar-registry:
    needs: deploy
    # Defensivo: este workflow não dispara em PR hoje. Fica explícito para o dia
    # em que alguém acrescentar o gatilho.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # Sem tag apontando: lixo puro, só referenciável por digest — não serve
      # nem para rollback.
      #
      # Só é seguro por causa da tag de sha adicionada no build acima: sem ela,
      # a imagem anterior perdia a tag a cada push e este passo apagaria o
      # histórico inteiro.
      #
      # Seguro também quanto a multi-arch porque o build é de uma plataforma só
      # e o provenance default do build-push-action no Actions é inline (grava
      # no config da imagem, não num manifest separado). Se este build virar
      # multi-arch, os manifests por arquitetura viram versões sem tag e este
      # passo quebraria a imagem publicada. Revise antes de pôr arm64.
      - name: Apagar versões sem tag
        uses: actions/delete-package-versions@v5
        with:
          package-name: prospec-o-fan-tica
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 0

      # Quatro, e não uma: o rollback deste serviço é redeploy da tag anterior,
      # então guardar só a atual tornaria a recuperação impossível. Quatro cobre
      # "o deploy ruim foi dois ou três atrás".
      - name: Manter apenas as 4 versões mais recentes
        uses: actions/delete-package-versions@v5
        with:
          package-name: prospec-o-fan-tica
          package-type: container
          min-versions-to-keep: 4
